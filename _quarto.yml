project:
  type: book
  resources:
    - examples/verilator/accumulator.sv
    - examples/verilator/sim_main.cpp
    - examples/reference-models/check.S
    - examples/reference-models/link.ld
    - examples/reference-models/expected.signature
    - examples/cocotb/test_accumulator.py
    - examples/cocotb/Makefile
    - examples/cocotb/requirements.txt

book:
  site-url: https://antoniofloresgil.github.io/FromConceptToSiliconBook/
  title: "From Concept to Silicon"
  subtitle: "A Hands-On Guide to Open-Source SoC Design Using RISC-V"
  author: "Antonio Flores Gil"
  date: "12/10/2026"
  chapters:
    - index.qmd
    - intro.qmd
    - part: "I. Foundations"
      chapters:
        - chapters/01-foundations/risc-v-isa.qmd
        - chapters/01-foundations/systemverilog.qmd
        - chapters/01-foundations/microarchitecture.qmd
        - chapters/01-foundations/clocking-timing.qmd
    - part: "II. Open-Source RISC-V Cores"
      chapters:
        - chapters/02-risc-v-cores/core-v-wally.qmd
        - chapters/02-risc-v-cores/other-architectures.qmd
    - part: "III. Simulation and Verification"
      chapters:
        - chapters/03-simulation-verification/verilator.qmd
        - chapters/03-simulation-verification/spike-sail.qmd
        - chapters/03-simulation-verification/cocotb.qmd
    - part: "IV. SoC Architecture"
      chapters:
        - chapters/04-soc-architecture/pipelines.qmd
        - chapters/04-soc-architecture/memories-caches.qmd
        - chapters/04-soc-architecture/buses-interrupts.qmd
        - chapters/04-soc-architecture/peripherals.qmd
    - part: "V. FPGA Implementation"
      chapters:
        - chapters/05-fpga-implementation/yosys.qmd
        - chapters/05-fpga-implementation/nextpnr-timing.qmd
        - chapters/05-fpga-implementation/fpga-soc.qmd
    - part: "VI. ASIC Implementation"
      chapters:
        - chapters/06-asic-implementation/rtl-to-gdsii.qmd
        - chapters/06-asic-implementation/openroad.qmd
        - chapters/06-asic-implementation/librelane.qmd
    - part: "VII. Advanced Topics"
      chapters:
        - chapters/07-advanced-topics/pmu.qmd
        - chapters/07-advanced-topics/debug.qmd
        - chapters/07-advanced-topics/accelerators-extensions.qmd
        - chapters/07-advanced-topics/architecture-exploration.qmd
    - summary.qmd
    - references.qmd
  appendices:
    - appendices/wally-style.qmd
    - appendices/systemverilog-cheatsheet.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - brand
  pdf:
    documentclass: scrreprt



