name: Hardware generators (optional)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build pinned generator environment
        run: |
          docker build -f labs/Dockerfile -t from-concept-labs:2026.10 .
          docker build --platform linux/amd64 -f labs/19-hardware-generators/Dockerfile -t from-concept-generators:2026.10 .
      - name: Generate and check offline as runner UID
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp
          --env CASE_IMAGE_ID="$(docker image inspect --format '{{.Id}}' from-concept-generators:2026.10)"
          --mount "type=bind,source=$PWD,target=/work" from-concept-generators:2026.10
          python labs/19-hardware-generators/run.py --output-dir labs/build/hardware-generators-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hardware-generators-evidence
          path: labs/build/hardware-generators-ci/
