<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc"><title id="title">Visual identity study</title><desc id="desc">Editorial prototype for From Concept to Silicon by Antonio Flores Gil. Editable vector artwork; not a measured hardware layout.</desc><rect x="0" y="0" width="1400" height="1100" fill="#F5F2EB" /><text x="64" y="68" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" letter-spacing="2">FROM CONCEPT TO SILICON / EDITORIAL IDENTITY</text><text x="60" y="142" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="700" >From a connection to a system.</text><text x="64" y="191" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" >A precise, quiet identity built from layered systems, generous space and a clear reading hierarchy.</text><text x="64" y="220" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" >The cover artwork is a conceptual illustration, not a physical implementation result.</text><rect x="64" y="275" width="190" height="100" fill="#000000" stroke="#B5C3CE" stroke-width="1"/><text x="64" y="405" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" >Cover</text><text x="64" y="435" fill="#182B3A" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" >#000000</text><rect x="276" y="275" width="190" height="100" fill="#101F30" stroke="#B5C3CE" stroke-width="1"/><text x="276" y="405" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" >Structure</text><text x="276" y="435" fill="#182B3A" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" >#101F30</text><rect x="488" y="275" width="190" height="100" fill="#4DD8FF" stroke="#B5C3CE" stroke-width="1"/><text x="488" y="405" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" >Connections</text><text x="488" y="435" fill="#182B3A" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" >#4DD8FF</text><rect x="700" y="275" width="190" height="100" fill="#F5B544" stroke="#B5C3CE" stroke-width="1"/><text x="700" y="405" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" >Amber accent</text><text x="700" y="435" fill="#182B3A" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" >#F5B544</text><rect x="912" y="275" width="190" height="100" fill="#F5F2EB" stroke="#B5C3CE" stroke-width="1"/><text x="912" y="405" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" >Reading surface</text><text x="912" y="435" fill="#182B3A" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" >#F5F2EB</text><rect x="1124" y="275" width="190" height="100" fill="#182B3A" stroke="#B5C3CE" stroke-width="1"/><text x="1124" y="405" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" >Text</text><text x="1124" y="435" fill="#182B3A" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" >#182B3A</text><path d="M64 473H1336" stroke="#B5C3CE" stroke-width="1"/><text x="64" y="520" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="2">TYPOGRAPHY</text><text x="64" y="577" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="39" font-weight="700" >Design with evidence.</text><text x="64" y="615" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" >DejaVu Sans / titles, navigation, captions</text><text x="64" y="678" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="29" font-weight="400" >A readable path through complexity.</text><text x="64" y="716" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" >DejaVu Serif / long-form reading</text><text x="64" y="776" fill="#182B3A" font-family="DejaVu Sans Mono, monospace" font-size="25" font-weight="400" >assert (count &lt;= DEPTH);</text><text x="64" y="814" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" >DejaVu Sans Mono / RTL, commands, identifiers</text><rect x="890" y="520" width="446" height="320" fill="#101F30" /><text x="920" y="564" fill="#B5C3CE" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" >GRAPHIC GRAMMAR</text><path d="M920 620H1302" stroke="#4DD8FF" stroke-width="2"/><text x="920" y="605" fill="#F5F2EB" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" >01  Explicit interfaces</text><path d="M920 696H1302" stroke="#F5B544" stroke-width="2"/><text x="920" y="681" fill="#F5F2EB" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" >02  Visible boundaries</text><path d="M920 772H1302" stroke="#4DD8FF" stroke-width="2"/><text x="920" y="757" fill="#F5F2EB" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" >03  Traceable transitions</text><path d="M64 880H1336" stroke="#B5C3CE" stroke-width="1"/><text x="64" y="925" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" >PRINT &amp; ACCESS</text><text x="64" y="955" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" >Labels and geometry carry meaning; color is supplementary.</text><text x="64" y="985" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" >Use dark text on paper. Reserve cyan and amber text for dark backgrounds.</text><text x="64" y="1015" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" >Review at final size and in grayscale before production.</text><text x="64" y="1065" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" >DIGITAL EDITION · A4 (210 × 297 mm); separate production specifications are needed for print binding.</text></svg>
