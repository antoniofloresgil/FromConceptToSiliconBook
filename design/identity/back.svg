<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" role="img" aria-labelledby="title desc"><title id="title">Back cover</title><desc id="desc">Editorial prototype for From Concept to Silicon by Antonio Flores Gil. Editable vector artwork; not a measured hardware layout.</desc><rect x="0" y="0" width="800" height="1100" fill="#F5F2EB" /><rect x="64" y="64" width="38" height="5" fill="#F5B544" /><text x="64" y="140" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="39" font-weight="700" >Design. Verify. Integrate.</text><text x="64" y="195" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" >Then follow the evidence.</text><text x="64" y="266" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" >An open SoC is more than a processor core. Its interfaces,</text><text x="64" y="297" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" >software, implementation constraints and verification</text><text x="64" y="328" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" >decisions must work together.</text><text x="64" y="359" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" ></text><text x="64" y="390" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" >From Concept to Silicon follows that journey through</text><text x="64" y="421" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" >RISC-V and CORE-V Wally, with SystemVerilog as its main</text><text x="64" y="452" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" >RTL language. A dot-product accelerator connects models,</text><text x="64" y="483" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" >tests, formal checks, integration and FPGA and ASIC flows.</text><text x="64" y="514" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" ></text><text x="64" y="545" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" >Executable laboratories and reference results make the</text><text x="64" y="576" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" >trade-offs concrete, including failed baselines, repairs</text><text x="64" y="607" fill="#182B3A" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" >and the limits of each validation step.</text><path d="M64 655H736" stroke="#B5C3CE" stroke-width="1"/><text x="64" y="696" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">THREE WAYS THROUGH THE BOOK</text><text x="64" y="745" fill="#182B3A" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" >01</text><text x="112" y="745" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" >Foundations</text><text x="112" y="770" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" >RTL, architecture and simulation</text><text x="64" y="811" fill="#182B3A" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" >02</text><text x="112" y="811" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" >Complete SoC</text><text x="112" y="836" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" >Wally, integration, firmware and FPGA</text><text x="64" y="877" fill="#182B3A" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400" >03</text><text x="112" y="877" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" >ASIC Design</text><text x="112" y="902" fill="#182B3A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" >Synthesis, physical design and GDSII</text><rect x="0" y="967" width="800" height="133" fill="#101F30" /><text x="64" y="1008" fill="#F5F2EB" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" letter-spacing="1">READ THE BOOK · EXPLORE THE LABS</text><a href="https://antoniofloresgil.github.io/FromConceptToSiliconBook/"><text x="64" y="1040" fill="#4DD8FF" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" >antoniofloresgil.github.io/FromConceptToSiliconBook/</text></a><text x="64" y="1072" fill="#B5C3CE" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" >Book &amp; original artwork: CC BY-SA 4.0 · Original code: MIT</text></svg>
