name: Explicit ASIC block implementation regression

# Deliberately separate from per-commit checks; never triggered by a PR alone.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardware:
    uses: ./.github/workflows/hardware-ci.yml
  repaired-asic:
    needs: hardware
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Acquire the pinned physical environment
        run: docker pull openroad/orfs@sha256:fd3e27cf1788815be526e86fbe449310d1114bf256fd6c7af9dced6eaf12c699
      - name: Route the locked block and check mapped versus routed equivalence
        run: |
          image=openroad/orfs@sha256:fd3e27cf1788815be526e86fbe449310d1114bf256fd6c7af9dced6eaf12c699
          identity=$(docker image inspect --format '{{.Id}}' "$image")
          docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env CASE_IMAGE_ID="$identity" --mount "type=bind,source=$PWD,target=/work" \
            -w /work "$image" bash -lc \
            'source /OpenROAD-flow-scripts/env.sh; python3 labs/21-physical-closure/run.py asic --candidate repair --output-dir labs/build/ci-asic-repair && python3 labs/21-physical-closure/verify_netlist.py labs/build/ci-asic-repair && python3 labs/25-hardware-ci/physical_gate.py labs/build/ci-asic-repair'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: asic-block-regression
          if-no-files-found: error
          path: labs/build/ci-asic-repair
