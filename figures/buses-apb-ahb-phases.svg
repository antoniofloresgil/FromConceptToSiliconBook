<text x="708.0" y="150" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Access, ready</text>
<text x="856.0" y="150" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Idle or Setup</text>
