<text x="44" y="658" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">APB never overlaps transfers. AHB overlaps address and data phases, but a stalled data</text>
<text x="44" y="683" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">phase still holds back every later address; AXI removes that coupling with independent</text>
<text x="44" y="708" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">channels.</text>
