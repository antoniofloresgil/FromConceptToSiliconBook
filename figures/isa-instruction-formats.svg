<text x="44" y="592" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">R register arithmetic • I immediate ALU, loads, jalr • S stores • B branches • U lui,</text>
<text x="44" y="617" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">auipc • J jal.</text>
<text x="44" y="642" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">B and J show the instruction bits an immediate comes from; the text reassembles them,</text>
<text x="44" y="667" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">sign-extends and adds the implied zero bit.</text>
