<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">Three abstractions of a CMOS inverter</title>
  <desc id="desc">Boolean inversion, an electrical RC driver, and a standard-cell footprint express different properties of the same implementation.</desc>
  <rect width="1080" height="380" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#162c40" text-anchor="middle">
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="540" y="32" font-size="23" font-weight="bold">One function, three engineering views</text>
    <g fill="#edf4fb" stroke="#477599" stroke-width="2">
      <rect x="20" y="60" width="330" height="260" rx="12"/>
      <rect x="375" y="60" width="330" height="260" rx="12"/>
      <rect x="730" y="60" width="330" height="260" rx="12"/>
    </g>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="185" y="96" font-size="21" font-weight="bold">Logical view</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="540" y="96" font-size="21" font-weight="bold">Electrical approximation</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="895" y="96" font-size="21" font-weight="bold">Physical abstract</text>
    <g stroke="#162c40" stroke-width="3" fill="white">
      <path d="M130 132 L130 218 L210 175 Z"/>
      <circle cx="220" cy="175" r="9"/>
      <path d="M85 175 H130 M229 175 H285" fill="none"/>
      <path d="M408 175 H437 L445 160 L460 190 L475 160 L490 190 L505 175 H650 M580 175 V220 M564 220 H596 M564 230 H596 M580 230 V253 M562 253 H598 M568 260 H592" fill="none"/>
      <rect x="780" y="128" width="230" height="118" fill="#fff"/>
    </g>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="95" y="157" font-size="18">A</text><text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="275" y="157" font-size="18">Y</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="185" y="254" font-size="20">Y = NOT A</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="185" y="293" font-size="18">Truth table and functional tests</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="470" y="145" font-size="18">R effective</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="637" y="220" font-size="18">C load</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="540" y="293" font-size="18">Drive, slew, delay and switching</text>
    <path d="M780 128 H1010 M780 246 H1010" stroke="#a64135" stroke-width="7"/>
    <rect x="790" y="170" width="20" height="25" fill="#477599"/>
    <rect x="980" y="170" width="20" height="25" fill="#477599"/>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="830" y="189" font-size="18">A</text><text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="960" y="189" font-size="18">Y</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="895" y="119" font-size="18">VDD rail</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="895" y="274" font-size="18">Ground rail</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="895" y="302" font-size="18">Rows, pins, width and obstructions</text>
    <text text-anchor="middle" font-family="Arial, sans-serif" fill="#162c40" x="540" y="356" font-size="18">Original teaching diagram. Electrical values and legal geometries come from the selected library and PDK.</text>
  </g>
</svg>
