<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
 <title id="title">Three journeys across Wally</title>
 <desc id="desc">A cache-miss read crosses LSU, D-cache, EBU and RAM before writeback. A GPIO write bypasses cache allocation and crosses AHB and APB to the device. A timer interrupt goes from CLINT to privileged control, a handler and mret. Timelines show causal order, not fixed cycle counts.</desc>
 <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker><style>text{font-family:Arial,sans-serif;font-size:20px;fill:#172b3a}.heading{font-size:28px;font-weight:bold}.label{font-size:20px;font-weight:bold}.small{font-size:20px}.box{fill:#fff;stroke:#24577a;stroke-width:2;rx:10}.arrow{stroke:#24577a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
 <rect width="1200" height="700" fill="#fff"/><text x="35" y="42" class="heading">Three paths, three different meanings of completion</text>
 <text x="35" y="74" class="small">Causal order only: arbitration, wait states and pipeline alignment change the cycle count</text>
 <rect x="25" y="100" width="1150" height="165" rx="15" fill="#eef5fa"/><text x="45" y="130" class="label">1. Load from cacheable RAM, with a D-cache miss</text>
 <g><rect x="45" y="151" width="190" height="65" class="box"/><text x="64" y="179">LSU / checks</text><text x="64" y="203" class="small">effective address</text>
 <rect x="285" y="151" width="190" height="65" class="box"/><text x="308" y="179">D-cache miss</text><text x="308" y="203" class="small">reserve context</text>
 <rect x="525" y="151" width="230" height="65" class="box"/><text x="545" y="179">EBU → AHB RAM</text><text x="545" y="203" class="small">refill beats / waits</text>
 <rect x="810" y="151" width="320" height="65" class="box"/><text x="830" y="179">Refill → result → WB</text><text x="830" y="203" class="small">correct register / op</text>
 <path d="M235 184H285" class="arrow"/><path d="M475 184H525" class="arrow"/><path d="M755 184H810" class="arrow"/></g>
 <text x="45" y="245" class="small">Check the final value and the absence of early writeback; a miss is not itself a trap.</text>
 <rect x="25" y="285" width="1150" height="165" rx="15" fill="#f1f7ef"/><text x="45" y="315" class="label">2. MMIO store to GPIO output_val</text>
 <rect x="45" y="336" width="190" height="65" class="box"/><text x="65" y="364">LSU / attributes</text><text x="65" y="388" class="small">uncached access</text>
 <rect x="285" y="336" width="190" height="65" class="box"/><text x="310" y="364">EBU / AHB</text><text x="310" y="388" class="small">address / data</text>
 <rect x="525" y="336" width="230" height="65" class="box"/><text x="548" y="364">AHB-to-APB bridge</text><text x="548" y="388" class="small">setup then access</text>
 <rect x="810" y="336" width="320" height="65" class="box"/><text x="832" y="364">GPIO update → response</text><text x="832" y="388" class="small">enable output pin too</text>
 <path d="M235 369H285" class="arrow"/><path d="M475 369H525" class="arrow"/><path d="M755 369H810" class="arrow"/>
 <text x="45" y="430" class="small">Check exactly one completed device transfer; held bus signals do not mean repeated writes.</text>
 <rect x="25" y="470" width="1150" height="165" rx="15" fill="#fff3eb"/><text x="45" y="500" class="label">3. Machine timer interrupt</text>
 <rect x="45" y="521" width="190" height="65" class="box"/><text x="65" y="549">CLINT</text><text x="65" y="573" class="small">timer compare</text>
 <rect x="285" y="521" width="190" height="65" class="box"/><text x="305" y="549">Privileged / trap</text><text x="305" y="573" class="small">pending + enables</text>
 <rect x="525" y="521" width="230" height="65" class="box"/><text x="545" y="549">Trap entry / mtvec</text><text x="545" y="573" class="small">trap CSRs</text>
 <rect x="810" y="521" width="320" height="65" class="box"/><text x="832" y="549">Handler → rearm → mret</text><text x="832" y="573" class="small">restore saved context</text>
 <path d="M235 554H285" class="arrow"/><path d="M475 554H525" class="arrow"/><path d="M755 554H810" class="arrow"/>
 <text x="45" y="615" class="small">The timer event bypasses the PLIC; handler accesses use the ordinary bus path.</text>
 <text x="35" y="675" class="small">Original teaching diagram based on the inspected Wally configuration and RTL; see chapter sources.</text>
</svg>
