<text x="44" y="533" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">If both loads miss in the same narrow downstream port, the overlap may still be limited:</text>
<text x="44" y="558" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">counting execution units cannot substitute for asking how many misses can be in flight.</text>
