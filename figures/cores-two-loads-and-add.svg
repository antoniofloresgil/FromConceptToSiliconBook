<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Two loads and an independent add, with and without overlap</title><desc id="desc">Invented time units, not cycles • in-order retirement is not drawn</desc>
