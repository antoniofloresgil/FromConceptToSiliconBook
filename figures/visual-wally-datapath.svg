<svg xmlns="http://www.w3.org/2000/svg" width="960" height="683" viewBox="0 0 960 683" role="img" aria-labelledby="title desc">
<title id="title">Five stages: follow an instruction and its result</title><desc id="desc">Conceptual orientation for the simplified pipeline; arrows are dependencies, not cycle counts</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="683" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Five stages: follow an instruction and its result</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Conceptual orientation for the simplified pipeline; arrows are dependencies, not cycle counts</text>
