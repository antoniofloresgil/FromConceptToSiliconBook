<text x="44" y="593" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Linux/Wally extension decodes MMIO at 0x10080000; the IP itself receives register</text>
<text x="44" y="618" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">offsets.</text>
<text x="44" y="643" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Driver-managed buffers / ordering remain separate from the DMA bounds checked by the</text>
