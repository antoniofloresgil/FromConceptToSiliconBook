<svg xmlns="http://www.w3.org/2000/svg" width="960" height="548" viewBox="0 0 960 548" role="img" aria-labelledby="title desc">
<title id="title">A GDSII file is one part of the tapeout evidence</title><desc id="desc">The decision needs more than the layout • provider requirements come from the foundry or shuttle</desc>
<defs>
