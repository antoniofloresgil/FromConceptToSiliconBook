<path d="M480 180V215" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M797 180V215H620" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M163 350V315H340" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M782 350V315H620" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="450" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="478" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">An open PDK and an MPW announcement are a good start; current eligibility and acceptance</text>
<text x="44" y="503" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">come from the provider, and a local flow result is not a standing right to manufacture.</text>
</g></svg>
