<svg xmlns="http://www.w3.org/2000/svg" width="960" height="498" viewBox="0 0 960 498" role="img" aria-labelledby="title desc">
<title id="title">A masked write changes lanes, not the whole word</title><desc id="desc">Little-endian 32-bit word • the mask is a lane enable, not data</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="498" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">A masked write changes lanes, not the whole word</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Little-endian 32-bit word • the mask is a lane enable, not data</text>
<text x="260.0" y="100" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">byte +0</text>
<text x="400.0" y="100" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">byte +1</text>
<text x="540.0" y="100" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">byte +2</text>
<text x="680.0" y="100" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">byte +3</text>
<text x="28" y="153" font-size="20" text-anchor="start" fill="#172b3a" font-weight="normal">stored word</text>
<rect x="196" y="120" width="128" height="48" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="260.0" y="152" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">44</text>
<rect x="336" y="120" width="128" height="48" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="400.0" y="152" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">33</text>
<rect x="476" y="120" width="128" height="48" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="540.0" y="152" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">22</text>
<rect x="616" y="120" width="128" height="48" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="680.0" y="152" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">11</text>
<text x="762" y="152" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">0x11223344</text>
<text x="28" y="223" font-size="20" text-anchor="start" fill="#172b3a" font-weight="normal">write data</text>
<rect x="196" y="190" width="128" height="48" rx="10" fill="white" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="260.0" y="222" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">DD</text>
<rect x="336" y="190" width="128" height="48" rx="10" fill="white" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="400.0" y="222" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">CC</text>
<rect x="476" y="190" width="128" height="48" rx="10" fill="white" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="540.0" y="222" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">BB</text>
<rect x="616" y="190" width="128" height="48" rx="10" fill="white" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="680.0" y="222" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">AA</text>
<text x="762" y="222" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">0xAABBCCDD</text>
<text x="28" y="293" font-size="20" text-anchor="start" fill="#172b3a" font-weight="normal">mask 0101</text>
<rect x="196" y="260" width="128" height="48" rx="10" fill="white" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="260.0" y="292" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">1</text>
<rect x="336" y="260" width="128" height="48" rx="10" fill="white" stroke="#a34624" stroke-width="2" stroke-dasharray="8 5"/>
<text x="400.0" y="292" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">0</text>
<rect x="476" y="260" width="128" height="48" rx="10" fill="white" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="540.0" y="292" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">1</text>
<rect x="616" y="260" width="128" height="48" rx="10" fill="white" stroke="#a34624" stroke-width="2" stroke-dasharray="8 5"/>
<text x="680.0" y="292" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">0</text>
<text x="762" y="292" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">lanes 0 and 2</text>
<text x="28" y="363" font-size="20" text-anchor="start" fill="#172b3a" font-weight="normal">result</text>
<rect x="196" y="330" width="128" height="48" rx="10" fill="white" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="260.0" y="362" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="bold">DD</text>
<rect x="336" y="330" width="128" height="48" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="400.0" y="362" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">33</text>
<rect x="476" y="330" width="128" height="48" rx="10" fill="white" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="540.0" y="362" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="bold">BB</text>
<rect x="616" y="330" width="128" height="48" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="680.0" y="362" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">11</text>
<text x="762" y="362" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">0x11BB33DD</text>
<rect x="28" y="400" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="428" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Lanes 0 and 2 take the write data; lanes 1 and 3 keep the stored bytes, so the word</text>
<text x="44" y="453" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">becomes 0x11BB33DD.</text>
</g></svg>
