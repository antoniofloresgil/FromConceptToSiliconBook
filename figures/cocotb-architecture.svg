<svg xmlns="http://www.w3.org/2000/svg" width="960" height="513" viewBox="0 0 960 513" role="img" aria-labelledby="title desc">
<title id="title">Where cocotb sits between the test and the simulator</title><desc id="desc">The circuit stays in SystemVerilog or VHDL • a HDL simulator executes it • cocotb is not a simulator</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="513" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Where cocotb sits between the test and the simulator</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">The circuit stays in SystemVerilog or VHDL • a HDL simulator executes it • cocotb is not a simulator</text>
<rect x="28" y="110" width="250" height="130" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="153.0" y="146.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Python test</text>
<text x="153.0" y="172.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">async coroutines</text>
<text x="153.0" y="198.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">driver, monitor,</text>
<text x="153.0" y="224.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">reference model</text>
<rect x="335" y="110" width="230" height="130" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="450.0" y="158.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">cocotb</text>
<text x="450.0" y="184.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">triggers, await</text>
<text x="450.0" y="210.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">dut.signal.value</text>
<rect x="622" y="110" width="310" height="130" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="777.0" y="158.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">HDL simulator</text>
<text x="777.0" y="184.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">executes the RTL</text>
<text x="777.0" y="210.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">schedules every event</text>
<path d="M278 165H335" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M565 165H622" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M335 205H278" fill="none" stroke="#28705c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#memory)"/>
<path d="M622 205H565" fill="none" stroke="#28705c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#memory)"/>
<text x="450" y="90" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">edges, ReadOnly, values</text>
<rect x="622" y="290" width="310" height="100" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="777.0" y="335.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">RTL under test</text>
<text x="777.0" y="361.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">SystemVerilog or VHDL</text>
<path d="M777 240V290" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="290" width="537" height="100" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="296.5" y="323.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Evidence</text>
<text x="296.5" y="349.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Python assertions and a non-zero exit status;</text>
<text x="296.5" y="375.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">an XML report alone is not enough</text>
<path d="M335 240V265H190V290" fill="none" stroke="#28705c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#memory)"/>
<rect x="28" y="415" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="443" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Calls between Python and the simulator have a cost: measure the actual workload before</text>
<text x="44" y="468" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">deciding which testbench language is faster. A passing test is evidence, not proof.</text>
</g></svg>
