<rect x="28" y="252" width="250" height="60" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="153.0" y="288.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Custom instruction</text>
<rect x="310" y="252" width="320" height="60" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="470.0" y="275.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Short register-to-register</text>
<text x="470.0" y="301.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">operation</text>
<path d="M278 282.0H310" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="662" y="252" width="270" height="60" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="797.0" y="275.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Pipeline and</text>
<text x="797.0" y="301.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">toolchain change</text>
