<rect x="28" y="322" width="250" height="60" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="153.0" y="345.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Internal</text>
<text x="153.0" y="371.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">functional unit</text>
<rect x="310" y="322" width="320" height="60" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="470.0" y="345.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Core-local</text>
<text x="470.0" y="371.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">multicycle operation</text>
<path d="M278 352.0H310" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="662" y="322" width="270" height="60" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="797.0" y="345.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Stalls, forwarding,</text>
<text x="797.0" y="371.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">exceptions</text>
<path d="M630 352.0H662" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="392" width="250" height="60" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="153.0" y="428.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">MMIO accelerator</text>
<rect x="310" y="392" width="320" height="60" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="470.0" y="415.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Longer job with</text>
<text x="470.0" y="441.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">explicit control</text>
<path d="M278 422.0H310" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="662" y="392" width="270" height="60" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="797.0" y="415.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Driver, transfer,</text>
<text x="797.0" y="441.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">synchronization</text>
<path d="M630 422.0H662" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="462" width="250" height="60" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="153.0" y="485.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">DMA-capable</text>
<text x="153.0" y="511.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">accelerator</text>
<rect x="310" y="462" width="320" height="60" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="470.0" y="485.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Large streaming</text>
<text x="470.0" y="511.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">buffers</text>
<path d="M278 492.0H310" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="662" y="462" width="270" height="60" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="797.0" y="485.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Arbitration, coherence,</text>
<text x="797.0" y="511.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">protection</text>
<path d="M630 492.0H662" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="540" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="568" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">A population count belongs in the instruction datapath; a 1024-sample filter has</text>
<text x="44" y="593" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">descriptors, buffers and a completion event, so it fits an MMIO or DMA engine.</text>
