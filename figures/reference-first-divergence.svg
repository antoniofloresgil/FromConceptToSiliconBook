<svg xmlns="http://www.w3.org/2000/svg" width="960" height="623" viewBox="0 0 960 623" role="img" aria-labelledby="title desc">
<title id="title">A signature says it is wrong; the retirement log says where</title><desc id="desc">Recorded example: Spike reference against a faulty stand-in • retired instructions #22 to #25</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="623" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">A signature says it is wrong; the retirement log says where</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Recorded example: Spike reference against a faulty stand-in • retired instructions #22 to #25</text>
<text x="28" y="100" font-size="21" text-anchor="start" fill="#172b3a" font-weight="bold">Signature view</text>
<rect x="28" y="112" width="904" height="50" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="8 5"/>
<text x="44" y="144" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">faulty signature: differs at word 3, a stored word, with a long program in between</text>
<text x="28" y="205" font-size="21" text-anchor="start" fill="#172b3a" font-weight="bold">Retirement view</text>
<text x="260" y="235" font-size="19" text-anchor="middle" fill="#172b3a" font-weight="bold">reference (Spike)</text>
<text x="700" y="235" font-size="19" text-anchor="middle" fill="#172b3a" font-weight="bold">faulty stand-in</text>
<text x="28" y="281" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">#22</text>
<text x="88" y="281" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">0x8000001c</text>
<rect x="250" y="250" width="330" height="44" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="415" y="279" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">x5  &lt;- 0x7</text>
<rect x="600" y="250" width="332" height="44" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="766" y="279" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">x5  &lt;- 0x7</text>
<text x="28" y="335" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">#23</text>
<text x="88" y="335" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">0x80000020</text>
<rect x="250" y="304" width="330" height="44" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="415" y="333" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">branch, no write</text>
<rect x="600" y="304" width="332" height="44" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="766" y="333" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">branch, no write</text>
<text x="28" y="389" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">#24</text>
<text x="88" y="389" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">0x80000024</text>
<rect x="250" y="358" width="330" height="44" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="415" y="387" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">x5  &lt;- 0xff..ff</text>
<rect x="600" y="358" width="332" height="44" rx="10" fill="white" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="766" y="387" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">x5  &lt;- 0xff..ff</text>
<text x="28" y="443" font-size="19" text-anchor="start" fill="#172b3a" font-weight="bold">#25</text>
<text x="88" y="443" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">0x80000028</text>
<rect x="250" y="412" width="330" height="44" rx="10" fill="white" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="415" y="441" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">x12 &lt;- 0x1</text>
<rect x="600" y="412" width="332" height="44" rx="10" fill="white" stroke="#a34624" stroke-width="2" stroke-dasharray="8 5"/>
<text x="766" y="441" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">x12 &lt;- 0x0</text>
<text x="28" y="482" font-size="18" text-anchor="start" fill="#a34624" font-weight="normal">First divergence: encoding 0x0012a613, slti a2,t0,1. PC and encoding match;</text>
<text x="28" y="506" font-size="18" text-anchor="start" fill="#a34624" font-weight="normal">only the destination value differs.</text>
<rect x="28" y="525" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="553" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Compare at architectural boundaries: a pipeline cycle cannot be matched against one ISS</text>
<text x="44" y="578" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">step, so log each instruction where it retires.</text>
</g></svg>
