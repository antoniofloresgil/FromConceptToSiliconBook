<svg xmlns="http://www.w3.org/2000/svg" width="960" height="488" viewBox="0 0 960 488" role="img" aria-labelledby="title desc">
<title id="title">Fewer cycles can still be slower</title><desc id="desc">Worked arithmetic of the chapter • invented values, not Wally measurements</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="488" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Fewer cycles can still be slower</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Worked arithmetic of the chapter • invented values, not Wally measurements</text>
<text x="28" y="100" font-size="21" text-anchor="start" fill="#172b3a" font-weight="bold">Cycles</text>
<text x="28" y="148" font-size="20" text-anchor="start" fill="#172b3a" font-weight="bold">A</text>
<rect x="70" y="118" width="600.0" height="42" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="684.0" y="147" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">10,000 cycles</text>
<text x="28" y="200" font-size="20" text-anchor="start" fill="#172b3a" font-weight="bold">B</text>
<rect x="70" y="170" width="480.0" height="42" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="564.0" y="199" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">8,000 cycles</text>
<text x="28" y="260" font-size="21" text-anchor="start" fill="#172b3a" font-weight="bold">Time = cycles / frequency</text>
<text x="28" y="308" font-size="20" text-anchor="start" fill="#172b3a" font-weight="bold">A</text>
<rect x="70" y="278" width="520.0" height="42" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="604.0" y="307" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">200 us at 50 MHz</text>
<text x="28" y="360" font-size="20" text-anchor="start" fill="#172b3a" font-weight="bold">B</text>
<rect x="70" y="330" width="594.36" height="42" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="678.36" y="359" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">228.6 us at 35 MHz</text>
<rect x="28" y="390" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="418" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">B reduces cycles by 20 percent and still takes longer, because its implementation forces</text>
<text x="44" y="443" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">a lower clock.</text>
</g></svg>
