<svg xmlns="http://www.w3.org/2000/svg" width="960" height="548" viewBox="0 0 960 548" role="img" aria-labelledby="title desc">
<title id="title">Queues around a service: how much work is outstanding</title><desc id="desc">Depth D = 2 on both sides • a congested snapshot after the consumer pauses</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="548" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Queues around a service: how much work is outstanding</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Depth D = 2 on both sides • a congested snapshot after the consumer pauses</text>
<rect x="28" y="130" width="140" height="100" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="98.0" y="175.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Client</text>
<text x="98.0" y="201.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">source, sink</text>
<rect x="210" y="130" width="200" height="100" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="310.0" y="175.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Request FIFO</text>
<text x="310.0" y="201.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">depth D</text>
<rect x="450" y="130" width="190" height="100" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="545.0" y="163.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Service</text>
<text x="545.0" y="189.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">one operation</text>
<text x="545.0" y="215.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">or one result</text>
<rect x="680" y="130" width="252" height="100" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="806.0" y="175.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Response FIFO</text>
<text x="806.0" y="201.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">depth D</text>
<path d="M168 160H210" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M410 180H450" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M640 180H680" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M806 130V104H98V130" fill="none" stroke="#28705c" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#memory)"/>
<text x="450" y="96" font-size="18" text-anchor="middle" fill="#28705c" font-weight="normal">responses return to the client</text>
<text x="310" y="268" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">items held: 2</text>
<text x="545" y="268" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">items held: 1</text>
<text x="806" y="268" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">items held: 2</text>
<rect x="250" y="290" width="120" height="52" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="310" y="324" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">■   ■</text>
<rect x="487" y="290" width="116" height="52" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="545" y="324" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">■</text>
<rect x="746" y="290" width="120" height="52" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="806" y="324" font-size="22" text-anchor="middle" fill="#172b3a" font-weight="normal">■   ■</text>
<path d="M250 372H866" fill="none" stroke="#24577a" stroke-width="1.2"/>
<text x="310" y="398" font-size="20" text-anchor="middle" fill="#172b3a" font-weight="bold">D</text>
<text x="545" y="398" font-size="20" text-anchor="middle" fill="#172b3a" font-weight="bold">+ 1</text>
<text x="806" y="398" font-size="20" text-anchor="middle" fill="#172b3a" font-weight="bold">+ D</text>
<text x="560" y="430" font-size="20" text-anchor="middle" fill="#172b3a" font-weight="bold">at most 2D + 1 = 5 outstanding items</text>
<rect x="28" y="450" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="478" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">The source keeps any request that was not accepted; nothing is deleted to make room.</text>
<text x="44" y="503" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Space on the request side says nothing about the capacity to execute another operation.</text>
</g></svg>
