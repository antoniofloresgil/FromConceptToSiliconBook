<svg xmlns="http://www.w3.org/2000/svg" width="960" height="558" viewBox="0 0 960 558" role="img" aria-labelledby="title desc">
<title id="title">Device event to trap: every gate can hold the request</title><desc id="desc">Machine-mode path of the chapter • cause codes 11, 7 and 3 • one hart, nested interrupts off</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="558" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Device event to trap: every gate can hold the request</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Machine-mode path of the chapter • cause codes 11, 7 and 3 • one hart, nested interrupts off</text>
<rect x="28" y="100" width="214" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="135.0" y="135.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">GPIO or UART</text>
<text x="135.0" y="161.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">pending, enable</text>
<rect x="28" y="220" width="214" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="135.0" y="255.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">CLINT timer</text>
<text x="135.0" y="281.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">mtime &gt;= mtimecmp</text>
<rect x="28" y="340" width="214" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="135.0" y="375.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">CLINT msip</text>
<text x="135.0" y="401.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">bit 0 of msip</text>
<rect x="300" y="100" width="200" height="80" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="400.0" y="123.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">PLIC</text>
<text x="400.0" y="149.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">priority &gt; threshold</text>
<text x="400.0" y="175.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">context enable</text>
<path d="M242 140H300" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="560" y="100" width="170" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="645.0" y="135.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">mip.MEIP</text>
<text x="645.0" y="161.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">external, cause 11</text>
<rect x="560" y="220" width="170" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="645.0" y="255.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">mip.MTIP</text>
<text x="645.0" y="281.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">timer, cause 7</text>
<rect x="560" y="340" width="170" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="645.0" y="375.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">mip.MSIP</text>
<text x="645.0" y="401.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">software, cause 3</text>
<path d="M500 140H560" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M242 260H560" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M242 380H560" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="780" y="195" width="152" height="130" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="856.0" y="243.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">mie bit</text>
<text x="856.0" y="269.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">AND</text>
<text x="856.0" y="295.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">mstatus.MIE</text>
<path d="M730 140H755V240H780" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M730 260H780" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M730 380H755V290H780" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M856 325V360" fill="none" stroke="#a34624" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#event)"/>
<text x="856" y="388" font-size="18" text-anchor="middle" fill="#a34624" font-weight="bold">trap taken:</text>
<text x="856" y="412" font-size="18" text-anchor="middle" fill="#a34624" font-weight="normal">mcause = flag</text>
<text x="856" y="436" font-size="18" text-anchor="middle" fill="#a34624" font-weight="normal">+ cause code</text>
<rect x="28" y="460" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="488" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Disabling a gate does not clear the pending state behind it. PLIC priority and the CPU&#x27;s</text>
<text x="44" y="513" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">class order (timer, software, external) are different arbitration layers.</text>
</g></svg>
