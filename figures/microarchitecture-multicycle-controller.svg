<svg xmlns="http://www.w3.org/2000/svg" width="960" height="503" viewBox="0 0 960 503" role="img" aria-labelledby="title desc">
<title id="title">A multicycle controller: phases and exits</title><desc id="desc">Illustrative schedule from the chapter • not Wally’s pipeline</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="503" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">A multicycle controller: phases and exits</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Illustrative schedule from the chapter • not Wally’s pipeline</text>
<rect x="28" y="100" width="205" height="100" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="130.5" y="133.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Fetch request</text>
<text x="130.5" y="159.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">present the PC once</text>
<text x="130.5" y="185.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">exit: accepted</text>
<rect x="260" y="100" width="205" height="100" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="362.5" y="133.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Fetch wait</text>
<text x="362.5" y="159.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">hold the PC</text>
<text x="362.5" y="185.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">exit: response</text>
<path d="M233 150H260" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="492" y="100" width="205" height="100" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="594.5" y="133.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Decode</text>
<text x="594.5" y="159.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">capture operands</text>
<text x="594.5" y="185.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">exit: decoded</text>
<path d="M465 150H492" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="724" y="100" width="205" height="100" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="826.5" y="133.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Execute</text>
<text x="826.5" y="159.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">compute the result</text>
<text x="826.5" y="185.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">exit: result ready</text>
<path d="M697 150H724" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="724" y="285" width="205" height="100" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="826.5" y="318.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Data request</text>
<text x="826.5" y="344.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">present the access</text>
<text x="826.5" y="370.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">exit: accepted</text>
<rect x="492" y="285" width="205" height="100" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="594.5" y="318.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Data wait</text>
<text x="594.5" y="344.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">await data or ack</text>
<text x="594.5" y="370.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">exit: response</text>
<rect x="260" y="285" width="205" height="100" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="362.5" y="318.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Commit</text>
<text x="362.5" y="344.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">apply the updates</text>
<text x="362.5" y="370.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">then fetch the next</text>
<path d="M826 200V285" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<text x="836" y="262" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">load/store</text>
<path d="M724 335H697" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M492 335H465" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M260 335H130V200" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M760 200V245H362V285" fill="none" stroke="#a34624" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#event)"/>
<text x="372" y="236" font-size="18" text-anchor="start" fill="#a34624" font-weight="normal">ALU ops skip the data phases</text>
<rect x="28" y="405" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="433" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">A request state leaves when its target accepts. Staying in it while the target is</text>
<text x="44" y="458" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">ready would resend the request on every cycle.</text>
</g></svg>
