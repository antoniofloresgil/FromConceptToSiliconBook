<svg xmlns="http://www.w3.org/2000/svg" width="960" height="483" viewBox="0 0 960 483" role="img" aria-labelledby="title desc">
<title id="title">Compare all four corners before crediting either factor</title><desc id="desc">Baseline, A only, B only and A + B • the benefit of A can depend on B</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="483" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Compare all four corners before crediting either factor</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Baseline, A only, B only and A + B • the benefit of A can depend on B</text>
<text x="330" y="110" font-size="20" text-anchor="middle" fill="#172b3a" font-weight="bold">A off</text>
<text x="640" y="110" font-size="20" text-anchor="middle" fill="#172b3a" font-weight="bold">A on</text>
<text x="28" y="200" font-size="20" text-anchor="start" fill="#172b3a" font-weight="bold">B off</text>
<text x="28" y="330" font-size="20" text-anchor="start" fill="#172b3a" font-weight="bold">B on</text>
<rect x="180" y="125" width="290" height="110" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="325" y="191" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">baseline</text>
<rect x="490" y="125" width="290" height="110" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="635" y="191" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">A only</text>
<rect x="180" y="255" width="290" height="110" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="325" y="321" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">B only</text>
<rect x="490" y="255" width="290" height="110" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="635" y="321" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">A + B</text>
<rect x="28" y="385" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="413" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Prune illegal or infeasible combinations before expensive evaluation, but keep the</text>
<text x="44" y="438" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">reasons. Failed builds and wrong results remain part of the record.</text>
</g></svg>
