<svg xmlns="http://www.w3.org/2000/svg" width="960" height="458" viewBox="0 0 960 458" role="img" aria-labelledby="title desc">
<title id="title">A trap is not a function call</title><desc id="desc">Machine-mode entry and return with direct mtvec • hardware saves state, software saves registers</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="458" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">A trap is not a function call</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Machine-mode entry and return with direct mtvec • hardware saves state, software saves registers</text>
<rect x="28" y="100" width="290" height="235" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="173.0" y="152.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Hardware at entry</text>
<text x="173.0" y="178.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">mepc: resume address</text>
<text x="173.0" y="204.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">mcause: flag + code</text>
<text x="173.0" y="230.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">MPIE &lt;- MIE</text>
<text x="173.0" y="256.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">MIE &lt;- 0</text>
<text x="173.0" y="282.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">MPP &lt;- privilege</text>
<text x="173.0" y="308.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">PC &lt;- mtvec base</text>
<rect x="335" y="100" width="290" height="235" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="480.0" y="164.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Handler software</text>
<text x="480.0" y="190.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">save what it clobbers</text>
<text x="480.0" y="216.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">read mcause, test flag</text>
<text x="480.0" y="242.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">case 3, 7 or 11</text>
<text x="480.0" y="268.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">service the source</text>
<text x="480.0" y="294.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">restore registers</text>
<rect x="642" y="100" width="290" height="235" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="787.0" y="188.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">mret, in hardware</text>
<text x="787.0" y="214.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">MIE &lt;- MPIE</text>
<text x="787.0" y="240.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">privilege &lt;- MPP</text>
<text x="787.0" y="266.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">PC &lt;- mepc</text>
<path d="M318 215H335" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M625 215H642" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="360" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="388" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Hardware does not save the integer registers, and ret is not mret. For an interrupt,</text>
<text x="44" y="413" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">mepc is not advanced; advancing it by four is specific to exceptions.</text>
</g></svg>
