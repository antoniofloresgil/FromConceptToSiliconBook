<svg xmlns="http://www.w3.org/2000/svg" width="960" height="648" viewBox="0 0 960 648" role="img" aria-labelledby="title desc">
<title id="title">Out-of-order execution: order, readiness and recovery</title><desc id="desc">Conceptual physical-register design • no fixed BOOM or XiangShan widths implied</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="648" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Out-of-order execution: order, readiness and recovery</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Conceptual physical-register design • no fixed BOOM or XiangShan widths implied</text>
<rect x="28" y="105" width="190" height="85" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="123.0" y="142.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Fetch / decode</text>
<text x="123.0" y="168.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">program order</text>
<rect x="266" y="105" width="190" height="85" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="361.0" y="142.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Rename</text>
<text x="361.0" y="168.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">map + free list</text>
<rect x="504" y="105" width="190" height="85" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="599.0" y="142.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Dispatch</text>
<text x="599.0" y="168.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">allocate window</text>
<rect x="742" y="105" width="190" height="85" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="837.0" y="142.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Issue queues</text>
<text x="837.0" y="168.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">wait for operands</text>
<path d="M218 147H266" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M456 147H504" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M694 147H742" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="625" y="265" width="307" height="88" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="778.5" y="304.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Execute / load-store queue</text>
<text x="778.5" y="330.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">ready ops may pass older ops</text>
<path d="M837 190V265" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="300" y="265" width="265" height="88" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="432.5" y="304.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Physical register file</text>
<text x="432.5" y="330.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">operand read / result write</text>
<path d="M565 286H625" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M625 333H565" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M900 265V227H750V190" fill="none" stroke="#a34624" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#event)"/>
<text x="28" y="235" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Allocate ROB entry at dispatch</text>
<rect x="28" y="392" width="600" height="96" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="328.0" y="435.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Reorder buffer (ROB): oldest → youngest</text>
<text x="328.0" y="461.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">completion / exceptions; retire only from the head</text>
<path d="M599 190V240H120V392" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M779 353V373H570V392" fill="none" stroke="#a34624" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#event)"/>
<rect x="742" y="392" width="190" height="96" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="837.0" y="423.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Commit</text>
<text x="837.0" y="449.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">architectural state</text>
<text x="837.0" y="475.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">release old registers</text>
<path d="M628 440H742" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M837 488V514H12V205H361V190" fill="none" stroke="#a34624" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#event)"/>
<text x="385" y="535" font-size="19" text-anchor="start" fill="#a34624" font-weight="normal">Recovery restores rename state and discards younger work</text>
<rect x="28" y="550" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="578" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Issue follows readiness; commit follows program order. A finished instruction may still</text>
<text x="44" y="603" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">wait.</text>
</g></svg>
