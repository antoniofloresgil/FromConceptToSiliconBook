<text x="44" y="608" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Liberty tells the timer how fast a cell is; LEF tells the placer how wide it is and</text>
<text x="44" y="633" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">where its pins are. Freeze the PDK and library revision together.</text>
