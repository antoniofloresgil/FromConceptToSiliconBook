<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Which view serves which activity in the implementation flow</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">A dot marks the activity that mainly uses the view • mismatched views give runs that look fine</text>
