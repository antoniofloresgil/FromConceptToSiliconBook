<svg xmlns="http://www.w3.org/2000/svg" width="960" height="678" viewBox="0 0 960 678" role="img" aria-labelledby="title desc">
<title id="title">Which view serves which activity in the implementation flow</title><desc id="desc">A dot marks the activity that mainly uses the view • mismatched views give runs that look fine</desc>
