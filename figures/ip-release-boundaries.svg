<svg xmlns="http://www.w3.org/2000/svg" width="960" height="588" viewBox="0 0 960 588" role="img" aria-labelledby="title desc">
<title id="title">Reuse the release; adapt the platform</title><desc id="desc">One three-file RTL identity • platform collateral and evidence have separate owners</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="588" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Reuse the release; adapt the platform</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">One three-file RTL identity • platform collateral and evidence have separate owners</text>
<rect x="28" y="95" width="300" height="85" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="178.0" y="120.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">AXI subsystem</text>
<text x="178.0" y="146.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">AXI4-Lite stimulus + AXI RAM</text>
<text x="178.0" y="172.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">profiles: 16 / 256</text>
<rect x="632" y="95" width="300" height="85" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="782.0" y="120.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Real Wally RTL platform</text>
<text x="782.0" y="146.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">RV32 firmware / AHB adapter</text>
<text x="782.0" y="172.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">profile: 256; MMIO 0x10080000</text>
<rect x="632" y="215" width="300" height="65" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="782.0" y="242.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Platform policy</text>
<text x="782.0" y="268.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">decode / PMA / IRQ / buffers</text>
<path d="M782 180V215" fill="none" stroke="#a34624" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#event)"/>
<rect x="310" y="330" width="340" height="105" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="480.0" y="365.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">dotproduct_ip 1.1.0</text>
<text x="480.0" y="391.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">endpoint + engine + MAC</text>
<text x="480.0" y="417.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">same three SHA-256 identities</text>
<path d="M28 138H12V382H310" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M782 280V382H650" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="215" width="300" height="65" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="178.0" y="242.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Register schema → views</text>
<text x="178.0" y="268.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">RTL decode / C / assembly / docs</text>
<path d="M178 280V305H480V330" fill="none" stroke="#28705c" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#memory)"/>
<rect x="28" y="465" width="904" height="103" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="493" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">A platform changes adapters, addresses and policies. An IP change creates a new release.</text>
<text x="44" y="518" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Passing integration tests qualify these boundaries; technology-specific physical views</text>
<text x="44" y="543" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">need their own run.</text>
</g></svg>
