<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Vector length independent strip mining</title>
  <desc id="desc">A nineteen element array is processed in three chunks of eight, eight and three elements. This is one legal partition for VLMAX eight. Each iteration advances by the returned vector length.</desc>
  <rect width="960" height="390" fill="white"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#20354b">
    <text x="480" y="35" text-anchor="middle" font-size="24" font-weight="bold">One legal partition: N = 19, VLMAX = 8</text>
    <text x="480" y="65" text-anchor="middle" font-size="16">VLEN = 128 bits, SEW = 16 bits, LMUL = 1</text>
    <g stroke="#37638c" stroke-width="2">
      <rect x="210" y="100" width="288" height="50" fill="#dcecf8"/>
      <rect x="498" y="100" width="288" height="50" fill="#e1efdf"/>
      <rect x="786" y="100" width="108" height="50" fill="#fff0cf"/>
      <rect x="210" y="195" width="288" height="45" fill="#dcecf8"/>
      <rect x="498" y="245" width="288" height="45" fill="#e1efdf"/>
      <rect x="786" y="295" width="108" height="45" fill="#fff0cf"/>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="354" y="131">Elements 0–7</text><text x="642" y="131">Elements 8–15</text>
      <text x="840" y="131">16–18</text>
    </g>
    <g font-size="16">
      <text x="25" y="130">Input array</text>
      <text x="25" y="224">AVL = 19, vl = 8</text>
      <text x="25" y="274">AVL = 11, vl = 8</text>
      <text x="25" y="324">AVL = 3, vl = 3</text>
      <text x="480" y="373" text-anchor="middle">Advance by actual vl. For AVL = 11, other legal choices include vl = 6 or 7.</text>
    </g>
  </g>
</svg>
