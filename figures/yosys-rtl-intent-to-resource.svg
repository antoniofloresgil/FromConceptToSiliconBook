<svg xmlns="http://www.w3.org/2000/svg" width="960" height="618" viewBox="0 0 960 618" role="img" aria-labelledby="title desc">
<title id="title">Express the intent so the tool can infer the right resource</title><desc id="desc">RTL intent, the FPGA resource it should map to, and the review question</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="618" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Express the intent so the tool can infer the right resource</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">RTL intent, the FPGA resource it should map to, and the review question</text>
<text x="28" y="100" font-size="19" text-anchor="start" fill="#172b3a" font-weight="bold">RTL intent</text>
<text x="360" y="100" font-size="19" text-anchor="start" fill="#172b3a" font-weight="bold">Expected resource</text>
<text x="652" y="100" font-size="19" text-anchor="start" fill="#172b3a" font-weight="bold">Review question</text>
<rect x="28" y="112" width="300" height="50" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="178.0" y="143.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Registered pipeline state</text>
<rect x="360" y="112" width="260" height="50" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="490.0" y="143.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Flip-flops, clock enable</text>
<path d="M328 137.0H360" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="652" y="112" width="280" height="50" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="792.0" y="143.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Reset on every bit?</text>
<path d="M620 137.0H652" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="174" width="300" height="50" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="178.0" y="205.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Small combinational table</text>
<rect x="360" y="174" width="260" height="50" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="490.0" y="205.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">LUT network</text>
<path d="M328 199.0H360" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="652" y="174" width="280" height="50" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="792.0" y="205.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Can the case be complete?</text>
<path d="M620 199.0H652" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="236" width="300" height="50" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="178.0" y="267.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Wide add or compare</text>
<rect x="360" y="236" width="260" height="50" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="490.0" y="267.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">LUTs plus carry chain</text>
<path d="M328 261.0H360" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="652" y="236" width="280" height="50" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="792.0" y="267.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Widths and signedness?</text>
<path d="M620 261.0H652" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="298" width="300" height="50" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="178.0" y="329.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Array, synchronous access</text>
<rect x="360" y="298" width="260" height="50" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="490.0" y="329.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Block or distributed RAM</text>
<path d="M328 323.0H360" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="652" y="298" width="280" height="50" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="792.0" y="329.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Does the pattern match?</text>
<path d="M620 323.0H652" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="360" width="300" height="50" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="178.0" y="391.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Multiply-accumulate</text>
<rect x="360" y="360" width="260" height="50" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="490.0" y="391.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">DSP block or LUT logic</text>
<path d="M328 385.0H360" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="652" y="360" width="280" height="50" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="792.0" y="391.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Is -nodsp intentional?</text>
<path d="M620 385.0H652" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="422" width="300" height="50" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="178.0" y="453.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Clock generation</text>
<rect x="360" y="422" width="260" height="50" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="490.0" y="453.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">PLL or MMCM, buffers</text>
<path d="M328 447.0H360" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="652" y="422" width="280" height="50" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="792.0" y="453.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Supported and constrained?</text>
<path d="M620 447.0H652" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="495" width="904" height="103" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="523" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">BRAM, DSP and clock resources are limited blocks: a design can synthesize and still fail</text>
<text x="44" y="548" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">later through resource use, an inferred RAM with the wrong read behavior, or a high-</text>
<text x="44" y="573" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">fanout reset.</text>
</g></svg>
