<text x="44" y="441" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Accept D0, D1, D2, D3 at edges 2, 5, 6, 7. Edges 3–4 do not advance the burst.</text>
<text x="44" y="466" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">While stalled, retain RDATA / RRESP / RID / RLAST. LAST belongs to the final beat.</text>
