<text x="44" y="688" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">In CPHA 0 the first data bit must already be available before the first sample edge. Bit</text>
<text x="44" y="713" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">order, frame length and select polarity come from the device specification.</text>
