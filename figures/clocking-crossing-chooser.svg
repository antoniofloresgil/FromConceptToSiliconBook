<svg xmlns="http://www.w3.org/2000/svg" width="960" height="638" viewBox="0 0 960 638" role="img" aria-labelledby="title desc">
<title id="title">Choose the crossing mechanism from what crosses</title><desc id="desc">Common mechanisms and their limits • the relationship between clocks must be true in hardware</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="638" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Choose the crossing mechanism from what crosses</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Common mechanisms and their limits • the relationship between clocks must be true in hardware</text>
<text x="28" y="95" font-size="19" text-anchor="start" fill="#172b3a" font-weight="bold">What crosses</text>
<text x="350" y="95" font-size="19" text-anchor="start" fill="#172b3a" font-weight="bold">Mechanism</text>
<text x="690" y="95" font-size="19" text-anchor="start" fill="#172b3a" font-weight="bold">Limit to design around</text>
<rect x="28" y="110" width="290" height="70" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="173.0" y="140.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Single, slowly changing</text>
<text x="173.0" y="166.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">control bit</text>
<rect x="350" y="110" width="290" height="70" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="495.0" y="140.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Two-flop synchronizer</text>
<text x="495.0" y="166.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">for a level signal</text>
<rect x="672" y="110" width="260" height="70" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="802" y="141" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">a short event can be</text>
<text x="802" y="167" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">missed; latency varies</text>
<path d="M318 145H350" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M640 145H672" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="195" width="290" height="70" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="173.0" y="237.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Pulse or event</text>
<rect x="350" y="195" width="290" height="70" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="495.0" y="225.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Toggle synchronizer or</text>
<text x="495.0" y="251.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">request/acknowledge</text>
<rect x="672" y="195" width="260" height="70" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="802" y="226" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">the source observes</text>
<text x="802" y="252" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">completion or keeps it</text>
<path d="M318 230H350" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M640 230H672" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="280" width="290" height="70" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="173.0" y="310.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Multi-bit data</text>
<text x="173.0" y="336.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">with control</text>
<rect x="350" y="280" width="290" height="70" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="495.0" y="310.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Handshake with a</text>
<text x="495.0" y="336.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">stable payload</text>
<rect x="672" y="280" width="260" height="70" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="802" y="311" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">the source holds the</text>
<text x="802" y="337" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">payload until accepted</text>
<path d="M318 315H350" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M640 315H672" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="365" width="290" height="70" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="173.0" y="395.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Independent streaming</text>
<text x="173.0" y="421.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">clocks</text>
<rect x="350" y="365" width="290" height="70" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="495.0" y="395.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Asynchronous FIFO,</text>
<text x="495.0" y="421.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Gray-coded pointers</text>
<rect x="672" y="365" width="260" height="70" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="802" y="396" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">pointer sync and an</text>
<text x="802" y="422" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">overflow policy</text>
<path d="M318 400H350" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M640 400H672" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="450" width="290" height="70" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="173.0" y="480.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Related clocks with</text>
<text x="173.0" y="506.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">known phase</text>
<rect x="350" y="450" width="290" height="70" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="495.0" y="480.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Generated-clock</text>
<text x="495.0" y="506.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">constraints</text>
<rect x="672" y="450" width="260" height="70" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="802" y="481" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">the relationship must</text>
<text x="802" y="507" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">hold in the hardware</text>
<path d="M318 485H350" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M640 485H672" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="540" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="568" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">An ordinary two-flop synchronizer is not a safe transport for a multi-bit word, a pulse</text>
<text x="44" y="593" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">that can be missed, or a transaction that needs data and control to stay together.</text>
</g></svg>
