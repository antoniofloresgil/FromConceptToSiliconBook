<svg xmlns="http://www.w3.org/2000/svg" width="960" height="693" viewBox="0 0 960 693" role="img" aria-labelledby="title desc">
<title id="title">From a netlist to a configured FPGA</title><desc id="desc">Open Xilinx 7-series flow for the Nexys Video • each arrow is an inspectable file</desc>
<defs>
