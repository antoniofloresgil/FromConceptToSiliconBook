<text x="153.0" y="215.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">XDC constraints</text>
<text x="153.0" y="241.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">clocks, pins, IO standards</text>
