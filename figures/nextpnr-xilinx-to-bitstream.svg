<text x="205.0" y="530.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">.bit</text>
<text x="205.0" y="556.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">configuration image</text>
