<rect x="350" y="500" width="250" height="70" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<rect x="347" y="512" width="6" height="6" fill="white" stroke="#24577a"/>
<rect x="347" y="524" width="6" height="6" fill="white" stroke="#24577a"/>
<rect x="347" y="536" width="6" height="6" fill="white" stroke="#24577a"/>
<text x="475.0" y="530.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">openFPGALoader</text>
<text x="475.0" y="556.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">program the board</text>
<path d="M305 535H350" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="595" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="623" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">FASM lists features; it is not the bitstream. A report that meets timing</text>
<text x="44" y="648" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">does not show that the board works.</text>
