<text x="153.0" y="305.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Chip database</text>
<text x="153.0" y="331.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">X-Ray, one exact part</text>
