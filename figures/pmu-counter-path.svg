<svg xmlns="http://www.w3.org/2000/svg" width="960" height="603" viewBox="0 0 960 603" role="img" aria-labelledby="title desc">
<title id="title">From an event to software: one performance counter</title><desc id="desc">mhpmeventN, mhpmcounterN and mcountinhibit • the event encoding is implementation-defined</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="603" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">From an event to software: one performance counter</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">mhpmeventN, mhpmcounterN and mcountinhibit • the event encoding is implementation-defined</text>
<rect x="28" y="100" width="240" height="95" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="148.0" y="130.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Event sources</text>
<text x="148.0" y="156.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">retire, branch, cache</text>
<text x="148.0" y="182.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">stall, exception</text>
<rect x="310" y="100" width="230" height="95" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="425.0" y="142.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Event select</text>
<text x="425.0" y="168.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">one signal per counter</text>
<rect x="590" y="100" width="342" height="95" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="761.0" y="130.5" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Counter N</text>
<text x="761.0" y="156.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">64-bit; low and high</text>
<text x="761.0" y="182.5" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">halves on RV32</text>
<path d="M268 147H310" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M540 147H590" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="310" y="250" width="230" height="80" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="425.0" y="285.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">mhpmeventN</text>
<text x="425.0" y="311.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">machine-mode CSR</text>
<path d="M425 250V195" fill="none" stroke="#a34624" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#event)"/>
<rect x="590" y="250" width="250" height="80" rx="10" fill="#fff3e9" stroke="#a34624" stroke-width="2" stroke-dasharray="none"/>
<text x="715.0" y="285.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">mcountinhibit</text>
<text x="715.0" y="311.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">bit N = 1 stops it</text>
<path d="M715 250V195" fill="none" stroke="#a34624" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#event)"/>
<rect x="590" y="395" width="342" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="761.0" y="430.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">CSR read port</text>
<text x="761.0" y="456.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">mcounteren gates lower privilege</text>
<path d="M860 195V395" fill="none" stroke="#28705c" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#memory)"/>
<rect x="28" y="395" width="480" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="268.0" y="418.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Software</text>
<text x="268.0" y="444.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">RV32: read high, low, high</text>
<text x="268.0" y="470.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">until the high half is stable</text>
<path d="M590 435H508" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="505" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="533" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Counters observe the workload and are not part of it.</text>
<text x="44" y="558" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">A selector that does nothing gives misleading measurements.</text>
</g></svg>
