<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">From RTL to a running Verilator model</title><desc id="desc">accumulator example • editing the RTL means rebuilding the executable</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="560" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">From RTL to a running Verilator model</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">accumulator example • editing the RTL means rebuilding the executable</text>
<rect x="28" y="100" width="250" height="70" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="153.0" y="130.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">accumulator.sv</text>
<text x="153.0" y="156.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">the RTL under test</text>
<rect x="28" y="190" width="250" height="70" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="153.0" y="220.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">sim_main.cpp</text>
<text x="153.0" y="246.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">stimulus, clock, checks</text>
<rect x="340" y="125" width="250" height="110" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="465.0" y="163.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">verilator</text>
<text x="465.0" y="189.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">--cc --exe --build</text>
<text x="465.0" y="215.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">-Wall --trace</text>
<path d="M278 135H309V150H340" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M278 225H309V210H340" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="650" y="125" width="282" height="110" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="791.0" y="163.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Generated C++ model</text>
<text x="791.0" y="189.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">obj_dir/Vaccumulator.h</text>
<text x="791.0" y="215.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">plus build rules</text>
<path d="M590 180H650" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<text x="340" y="262" font-size="18" text-anchor="start" fill="#a34624" font-weight="normal">-Wall warnings stop the build</text>
<rect x="28" y="330" width="250" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="153.0" y="353.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">C++ compiler</text>
<text x="153.0" y="379.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">make builds the model</text>
<text x="153.0" y="405.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">and the harness</text>
<rect x="340" y="330" width="250" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="465.0" y="365.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Vaccumulator</text>
<text x="465.0" y="391.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">executable simulation</text>
<rect x="650" y="330" width="282" height="80" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="791.0" y="353.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Result</text>
<text x="791.0" y="379.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">PASS or FAIL, exit status</text>
<text x="791.0" y="405.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">accumulator.vcd</text>
<path d="M791 235V292H153V330" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M278 370H340" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M590 370H650" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="440" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="468" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Each simulated cycle drives the inputs with the clock low, evaluates, raises</text>
<text x="44" y="493" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">the clock, evaluates, checks, lowers the clock and evaluates again.</text>
</g></svg>
