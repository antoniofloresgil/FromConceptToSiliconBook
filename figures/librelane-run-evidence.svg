<text x="848.0" y="161.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">adds GDSII</text>
<text x="28" y="225" font-size="21" text-anchor="start" fill="#172b3a" font-weight="bold">Evidence kept for every run tag</text>
<rect x="28" y="245" width="290" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="173.0" y="280.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">resolved.json</text>
<text x="173.0" y="306.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">which library and clock</text>
