<text x="480.0" y="161.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">adds placed cells</text>
<path d="M564 140H580" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="580" y="100" width="168" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="664.0" y="135.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Routing</text>
<text x="664.0" y="161.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">adds routes</text>
