<text x="479.0" y="306.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">first warning or error</text>
<rect x="640" y="245" width="290" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="785.0" y="280.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Per-step report</text>
<text x="785.0" y="306.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">timing, area, DRC, LVS</text>
<rect x="28" y="341" width="290" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="173.0" y="376.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">State or checkpoint</text>
<text x="173.0" y="402.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">reopen the design</text>
<rect x="334" y="341" width="290" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="479.0" y="376.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Metrics</text>
<text x="479.0" y="402.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">compare runs, CI gates</text>
<rect x="640" y="341" width="290" height="80" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="785.0" y="376.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Final views</text>
<text x="785.0" y="402.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">DEF, GDSII, netlist, SPEF</text>
<rect x="28" y="450" width="904" height="103" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="478" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Use a unique run tag for every experiment, never reuse one after changing RTL or</text>
<text x="44" y="503" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">configuration, and keep generated files out of the source repository: commit the inputs,</text>
<text x="44" y="528" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">a short results summary and the scripts.</text>
</g></svg>
