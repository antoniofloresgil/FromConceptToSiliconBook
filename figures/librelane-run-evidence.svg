<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">A run is a chain of states, and each step leaves evidence</title><desc id="desc">Find the earliest invalid step, not the last line of the console</desc>
