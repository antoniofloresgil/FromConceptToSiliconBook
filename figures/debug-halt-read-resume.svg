<svg xmlns="http://www.w3.org/2000/svg" width="960" height="618" viewBox="0 0 960 618" role="img" aria-labelledby="title desc">
<title id="title">Halt, read x10, write it back and resume</title><desc id="desc">Architectural sequence of the chapter • abstract commands through the Debug Module</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="618" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Halt, read x10, write it back and resume</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Architectural sequence of the chapter • abstract commands through the Debug Module</text>
<rect x="35" y="90" width="190" height="50" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="130.0" y="122.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Debugger</text>
<path d="M130 140V500" fill="none" stroke="#24577a" stroke-width="1.2"/>
<rect x="385" y="90" width="190" height="50" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="480.0" y="122.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Debug Module</text>
<path d="M480 140V500" fill="none" stroke="#24577a" stroke-width="1.2"/>
<rect x="735" y="90" width="190" height="50" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="830.0" y="122.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Hart 0</text>
<path d="M830 140V500" fill="none" stroke="#24577a" stroke-width="1.2"/>
<path d="M130 180H480" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<text x="305.0" y="171" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">1  set haltreq</text>
<path d="M480 225H830" fill="none" stroke="#a34624" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#event)"/>
<text x="655.0" y="216" font-size="18" text-anchor="middle" fill="#a34624" font-weight="normal">2  halt the hart</text>
<path d="M480 275H130" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<text x="305.0" y="266" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">3  dmstatus: halted</text>
<path d="M130 325H480" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<text x="305.0" y="316" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">4  command: read x10</text>
<path d="M480 370H130" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<text x="305.0" y="361" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">5  busy clear, cmderr 0, read data0</text>
<path d="M130 420H480" fill="none" stroke="#28705c" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#memory)"/>
<text x="305.0" y="411" font-size="18" text-anchor="middle" fill="#28705c" font-weight="normal">6  write data0, command: write x10</text>
<path d="M130 465H480" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<text x="305.0" y="456" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">7  set resumereq: the hart runs again</text>
<rect x="28" y="520" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="548" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Clear stale cmderr before the first command, poll abstractcs.busy after each one, and</text>
<text x="44" y="573" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">check dcsr, dpc and register contents at the architectural boundary.</text>
</g></svg>
