<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">One program, several executors, one comparison</title><desc id="desc">The functional models and the RTL run the same ELF</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="570" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">One program, several executors, one comparison</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">The functional models and the RTL run the same ELF</text>
<rect x="28" y="215" width="190" height="110" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="123.0" y="253.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">check.elf</text>
<text x="123.0" y="279.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">same bytes for</text>
<text x="123.0" y="305.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">every executor</text>
<rect x="290" y="100" width="250" height="90" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="415.0" y="140.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Spike</text>
<text x="415.0" y="166.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">functional reference</text>
<path d="M218 270H254V145H290" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M540 145H580V235H620" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="290" y="230" width="250" height="90" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="415.0" y="270.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Sail model</text>
<text x="415.0" y="296.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">functional reference</text>
<path d="M218 270H254V275H290" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M540 275H580V275H620" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="290" y="360" width="250" height="90" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<rect x="295" y="365" width="240" height="80" rx="7" fill="none" stroke="#28705c"/>
<text x="415.0" y="400.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">RTL under test</text>
<text x="415.0" y="426.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">testbench logger</text>
<path d="M218 270H254V405H290" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<path d="M540 405H580V315H620" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="620" y="195" width="312" height="150" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="776.0" y="253.0" font-size="21" text-anchor="middle" fill="#172b3a" font-weight="bold">Comparator</text>
<text x="776.0" y="279.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">signature words</text>
<text x="776.0" y="305.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">retired instructions</text>
<text x="776" y="395" font-size="18" text-anchor="middle" fill="#a34624" font-weight="normal">first difference wins:</text>
<text x="776" y="421" font-size="18" text-anchor="middle" fill="#a34624" font-weight="normal">repair it, then rerun</text>
<path d="M776 372V347" fill="none" stroke="#a34624" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#event)"/>
<rect x="28" y="472" width="904" height="78" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="500" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">A signature points to a wrong stored word; the retirement log points</text>
<text x="44" y="525" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">to the first instruction that differs. Timing needs other measurements.</text>
</g></svg>
