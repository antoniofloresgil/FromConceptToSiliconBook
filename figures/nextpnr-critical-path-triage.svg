<svg xmlns="http://www.w3.org/2000/svg" width="960" height="643" viewBox="0 0 960 643" role="img" aria-labelledby="title desc">
<title id="title">Read the reported endpoints first, then pick the response</title><desc id="desc">Common critical-path patterns and the smallest change that addresses each</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24577a"/></marker>
<marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a34624"/></marker>
<marker id="memory" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#28705c"/></marker>
</defs>
<rect width="960" height="643" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="28" y="33" font-size="26" text-anchor="start" fill="#172b3a" font-weight="bold">Read the reported endpoints first, then pick the response</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#172b3a" font-weight="normal">Common critical-path patterns and the smallest change that addresses each</text>
<text x="28" y="100" font-size="19" text-anchor="start" fill="#172b3a" font-weight="bold">Critical-path pattern</text>
<text x="440" y="100" font-size="19" text-anchor="start" fill="#172b3a" font-weight="bold">RTL or architecture response</text>
<rect x="28" y="112" width="380" height="56" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="218.0" y="146.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Deep arithmetic plus compare</text>
<rect x="440" y="112" width="460" height="56" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="670.0" y="133.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Pipeline it, or use a dedicated</text>
<text x="670.0" y="159.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">arithmetic resource</text>
<path d="M408 140.0H440" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="178" width="380" height="56" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="218.0" y="212.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Long priority chain</text>
<rect x="440" y="178" width="460" height="56" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="670.0" y="199.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Recode or balance the decision;</text>
<text x="670.0" y="225.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">register an intermediate result</text>
<path d="M408 206.0H440" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="244" width="380" height="56" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="218.0" y="278.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">High-fanout control or reset</text>
<rect x="440" y="244" width="460" height="56" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="670.0" y="265.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Reduce fanout, localize enables,</text>
<text x="670.0" y="291.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">use intended distribution</text>
<path d="M408 272.0H440" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="310" width="380" height="56" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="218.0" y="344.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">RAM output into complex decode</text>
<rect x="440" y="310" width="460" height="56" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="670.0" y="331.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Register the RAM output and</text>
<text x="670.0" y="357.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">accept the added cycle</text>
<path d="M408 338.0H440" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="376" width="380" height="56" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="218.0" y="410.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Ready/valid loop across modules</text>
<rect x="440" y="376" width="460" height="56" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="670.0" y="397.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Break it with an elastic</text>
<text x="670.0" y="423.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">register or pipeline stage</text>
<path d="M408 404.0H440" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="442" width="380" height="56" rx="10" fill="#eef5fa" stroke="#24577a" stroke-width="2" stroke-dasharray="none"/>
<text x="218.0" y="476.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="bold">Slow external interface path</text>
<rect x="440" y="442" width="460" height="56" rx="10" fill="#edf7f1" stroke="#28705c" stroke-width="2" stroke-dasharray="none"/>
<text x="670.0" y="463.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">Add valid IO constraints; pipeline</text>
<text x="670.0" y="489.0" font-size="18" text-anchor="middle" fill="#172b3a" font-weight="normal">if the protocol permits</text>
<path d="M408 470.0H440" fill="none" stroke="#24577a" stroke-width="2.5" stroke-dasharray="none" marker-end="url(#data)"/>
<rect x="28" y="520" width="904" height="103" rx="10" fill="#f2f4f6" stroke="#172b3a" stroke-width="2" stroke-dasharray="none"/>
<text x="44" y="548" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">Retiming changes latency and reset behavior, so it is an architectural change unless the</text>
<text x="44" y="573" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">interface contract tolerates it. After any change, rerun simulation and the formal</text>
<text x="44" y="598" font-size="19" text-anchor="start" fill="#172b3a" font-weight="normal">checks before trusting the new timing report.</text>
</g></svg>
